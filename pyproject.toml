[project]
name = "fortranspire"
version = "0.2.1"
description = "A 100% Private MCP Coding Assistant and Scientific Porting Pipeline"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Loïc Maurin", email = "maurin.loic.ac@gmail.com" }
]
license = { text = "Apache-2.0" }
keywords = [
    "fortran",
    "hpc",
    "gpu",
    "openacc",
    "jax",
    "cython",
    "loki",
    "mcp",
    "model-context-protocol",
    "mistral",
    "code-generation",
    "scientific-computing",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Fortran",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Compilers",
]
# ── Core dependencies ──────────────────────────────────────────────────────
# Minimal footprint required by `fortranspire analyze` (no LLM, no GPU).
# Loki is pulled via `loki-ifs` (a PyPI redistribution of ecmwf-ifs/loki @
# 0.3.7), maintained at https://github.com/maurinl26/loki-ifs. The Python
# import name is still `loki`, so all parser code (e.g. `from loki import
# Sourcefile`) works unchanged. We use `loki-ifs` and not a direct git-URL
# because PyPI's PEP 715 forbids direct URLs in `Requires-Dist`.
dependencies = [
    "loki-ifs>=0.3.7",
    "numpy",
    "python-dotenv>=1.0",
    "langgraph>=0.2.0",   # imported at module-load by parser_phase1; ~5 MB
]

[project.urls]
Homepage      = "https://github.com/maurinl26/fortranspire"
Documentation = "https://fortranspire.readthedocs.io"
Repository    = "https://github.com/maurinl26/fortranspire"
Issues        = "https://github.com/maurinl26/fortranspire/issues"
Changelog     = "https://github.com/maurinl26/fortranspire/blob/main/docs/changelog.md"

[project.optional-dependencies]

# CPU-only, no LLM, no GPU. Already covered by the core deps above — this
# alias exists so `uv sync --extra cpu` is a discoverable, self-documenting
# install path for CI runners and the Apptainer.analyze image.
cpu = []

# Fortran → GPU + Cython transformation pipeline (Phase 1).
# Pulls in the langchain stack and the Cython build chain. The actual GPU
# compilation requires `nvfortran` on the host — not a Python dependency.
gpu = [
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-community>=0.3",
    "langchain-mistralai>=0.1",
    "langchain-openai>=0.1",
    "Cython>=3.0",
    # Fortran-ecosystem helpers
    "fprettify>=0.3.7",   # source formatter — used by agent-format + Phase 1 post-step
    "fortls>=3.1",        # Language Server — oracle for symbol lookup (no hallucinations)
]

# MCP server (FastMCP HTTP/SSE) — exposes the transformation pipeline
# as MCP tools. Requires the [gpu] extra because the tools call into it.
mcp = [
    "fortranspire[gpu]",
    "fastmcp>=2.10.0",
]

# Phase 2 — Fortran → JAX (experimental, differentiable).
# Pulls in JAX + the LangChain stack (Phase 2 translation is LLM-driven too).
jax = [
    "fortranspire[gpu]",
    "jax[cpu]>=0.4.0",
    "flax>=0.8.0",
    "equinox>=0.11.0",
]

# Convenience meta-extra: everything except docs / tests.
all = [
    "fortranspire[gpu]",
    "fortranspire[mcp]",
    "fortranspire[jax]",
]

docs = [
    "sphinx>=7.3,<9",
    "furo>=2024.5",
    "myst-parser>=3.0",
    "sphinx-copybutton>=0.5.2",
    "sphinx-design>=0.6",
    "linkify-it-py>=2.0",
]
tests = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
# Unified CLI — the canonical entry point (issue #8).
# Subcommands: analyze, doc, explain, format, gpu, port-batch, translate,
# profile, mcp. Each takes `--help` for command-specific options.
fortranspire = "fortranspire.cli:main"

# Legacy aliases — kept for backwards compatibility, removed in 0.3.
# Each prints a one-line deprecation notice on stderr.
run-mcp = "fortranspire.server:main"

# Static analysis only (no LLM, CI-friendly)
agent-analyze  = "fortranspire.agent.cli:run_analyze"

# Documentation generator — inline !> docstrings + optional Sphinx site
agent-doc      = "fortranspire.agent.cli:run_doc"

# Fortran source formatter (fprettify wrapper, sensible defaults)
agent-format   = "fortranspire.agent.cli:run_format"

# Pre-flight cost + risk estimator (no LLM, no tokens — sales / RFI tool)
agent-explain  = "fortranspire.agent.cli:run_explain"

# Parallel batch port across many files — per-file output isolation
agent-port-batch = "fortranspire.agent.cli:run_port_batch"

# Phase 1 : Fortran → Fortran GPU + Cython
agent-gpu      = "fortranspire.agent.cli:run_translate_gpu"

# Phase 2 : Fortran → JAX (legacy)
agent-translate = "fortranspire.agent.cli:run_translate"
agent-profile   = "fortranspire.agent.cli:run_profile"

# Master dispatcher (toutes les actions)
agent-pipeline  = "fortranspire.agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The `vendor/loki-ifs` git submodule is a developer convenience (lets
# contributors hack on Loki next to fortranspire). It must NOT ship in
# the source distribution — `loki-ifs` is its own PyPI package, and
# duplicating ~1 MB of Loki source in every fortranspire sdist is waste.
[tool.hatch.build.targets.sdist]
exclude = [
    "vendor",
    ".github",
    "docs/build",
    "containers",
    "paper",
]

[tool.hatch.build.targets.wheel]
packages = ["fortranspire"]

[tool.pytest.ini_options]
# Only collect our own tests. The Loki redistribution under vendor/
# ships its own pytest suite that depends on a built Loki extension —
# leave it to the upstream maintainers to run.
testpaths = ["tests"]
# Skip slow tests by default (they shell out to gfortran and run the
# equivalence harness). CI re-enables them with `pytest -m slow` on the
# tests.yml workflow's "slow" job. Local users can do the same.
addopts = "-m 'not slow'"
# Custom markers — registering them silences "PytestUnknownMarkWarning"
# and lets users opt into / out of expensive checks (issue #45).
markers = [
    "slow: shells out to a Fortran compiler / runs a binary — opt-in via `pytest -m slow`",
]

[tool.uv]
override-dependencies = ["pydantic>=2.11.7"]
