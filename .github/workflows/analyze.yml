name: Fortran static analysis

# Dogfoods the reusable composite action published from this repo's root
# `action.yml` (issue #47). Deterministic Loki analysis only — no LLM is
# called, no token is consumed, no secret is needed, so it is safe on forks.
# Findings surface as inline PR annotations via GitHub Code Scanning.

on:
  pull_request:
    paths:
      - '**/*.f90'
      - '**/*.F90'
      - 'fortranspire/**'
      - 'action.yml'
      - '.github/workflows/analyze.yml'
  push:
    branches: [main]
    paths:
      - '**/*.f90'
      - '**/*.F90'
      - 'fortranspire/**'
      - 'action.yml'
      - '.github/workflows/analyze.yml'
  workflow_dispatch:
    inputs:
      target_path:
        description: 'Path to analyze (file or directory)'
        required: false
        default: '.'

permissions:
  contents: read
  security-events: write   # required to upload SARIF
  pull-requests: write     # required to post the port-cost comment

jobs:
  analyze:
    name: fortranspire analyze (Loki, no LLM)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2   # need HEAD~1 to diff changed files on PR

      - name: Pick paths to analyze
        id: paths
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "targets=${{ github.event.inputs.target_path }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Equivalence-harness fixtures (tests/fixtures/equivalence/) are
          # **test drivers** — they intentionally have I/O (write probe
          # values to stdout for pytest to parse). The analyzer correctly
          # flags them as FORT001 (I/O in kernel candidate), so we
          # exclude them from the CI gate. They are still exercised by
          # `pytest -m slow` (issue #45).
          EXCLUDE_PATTERN='^tests/fixtures/equivalence/'
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
            changed=$(git diff --name-only --diff-filter=ACMR \
              "origin/${{ github.base_ref }}...HEAD" \
              | grep -E '\.(f90|F90)$' \
              | grep -Ev "$EXCLUDE_PATTERN" || true)
          else
            changed=$(git diff --name-only --diff-filter=ACMR HEAD~1 HEAD \
              | grep -E '\.(f90|F90)$' \
              | grep -Ev "$EXCLUDE_PATTERN" || true)
          fi
          if [ -z "$changed" ]; then
            echo "No Fortran files to analyze (or all changed files are excluded fixtures)."
            echo "targets=" >> "$GITHUB_OUTPUT"
          else
            echo "Changed Fortran files:"
            echo "$changed"
            # The action takes a space-separated list.
            echo "targets=$(echo "$changed" | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          fi

      - name: fortranspire
        if: steps.paths.outputs.targets != ''
        uses: ./
        with:
          path: ${{ steps.paths.outputs.targets }}
          # Analyze the working tree, not the released wheel.
          version: local
          fail-on: error
          comment: true
          call-graph: true
