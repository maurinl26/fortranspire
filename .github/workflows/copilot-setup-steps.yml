name: Copilot Setup Steps

# Issue #49 — provisions the GitHub Copilot cloud agent's environment so it
# can launch the fortranspire MCP server.
#
# The job name is load-bearing: GitHub only picks up a job called
# `copilot-setup-steps`, and only from the default branch. Renaming it
# silently disables the whole thing.
#
# Only `steps`, `permissions`, `runs-on`, `services`, `snapshot` and
# `timeout-minutes` (max 59) are honoured here — anything else is ignored.

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Installed into a dedicated venv at a fixed absolute path, which the
      # MCP configuration names directly. Two reasons, both load-bearing:
      #
      #  * whether PATH changes made in setup steps are inherited by the
      #    process that launches MCP servers is undocumented, so the config
      #    must not rely on PATH;
      #  * installing into the runner's Debian-managed system Python fails —
      #    pip cannot uninstall distro-owned packages ("Cannot uninstall
      #    typing_extensions ... RECORD file not found"). A venv owns its
      #    own dependencies and sidesteps that entirely.
      #
      # No LLM extra: issue #49 exposes only the deterministic tools, so the
      # agent needs no API key and this install stays small.
      - name: Install fortranspire (deterministic tools only)
        run: |
          set -euo pipefail
          sudo python3 -m venv /opt/fortranspire
          sudo /opt/fortranspire/bin/pip install --quiet --upgrade pip
          sudo /opt/fortranspire/bin/pip install --quiet fortranspire
          ls -l /opt/fortranspire/bin/fortranspire
          /opt/fortranspire/bin/fortranspire --help > /dev/null
          echo "fortranspire is installed and launchable."
